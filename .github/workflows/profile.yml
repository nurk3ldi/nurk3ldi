name: profile assets

# Rebuilds the header (view count), stats cards and contribution snake into the `output` branch.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**", "scripts/**", "assets/avatar.jpg"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/stats.py --out dist

      - name: header with view count
        run: |
          # komarev counts every request, so this adds one view per run
          views=$(curl -fsS -A profile-assets "https://komarev.com/ghpvc/?username=${{ github.repository_owner }}" \
            | grep -oE '>[0-9]+<' | tail -1 | tr -d '<>' || true)
          python3 scripts/static_assets.py --header-only --out dist ${views:+--views "$views"}

      - name: contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161616,#3a3a3a,#6b6b6b,#a3a3a3,#fafafa
            dist/snake-light.svg?color_snake=#000000&color_dots=#ebebeb,#c4c4c4,#8a8a8a,#4d4d4d,#0a0a0a

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
