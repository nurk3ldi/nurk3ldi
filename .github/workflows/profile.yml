name: profile assets

# Rebuilds the view-count card, stats cards and the Pac-Man graph (drawn by stats.py) into the `output` branch.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**", "scripts/**", "assets/avatar.jpg"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/stats.py --out dist

      - name: view count card
        run: |
          # komarev counts every request, so this adds one view per run
          views=$(curl -fsS -A profile-assets "https://komarev.com/ghpvc/?username=${{ github.repository_owner }}" \
            | grep -oE '>[0-9]+<' | tail -1 | tr -d '<>' || true)
          python3 scripts/static_assets.py --out dist --views "${views:-0}"

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
