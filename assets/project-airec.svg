    <g font-size="20" fill="#a9b1d6"><text x="36" y="118">AI receptionist for small service businesses in Kazakhstan. Clients message the business's</text><text x="36" y="148">Telegram bot, the assistant answers from the real price list and opening hours, and files</text><text x="36" y="178">booking requests for the owner to confirm.</text></g>
